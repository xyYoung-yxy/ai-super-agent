name: gitleaks
on:
  workflow_dispatch:   # 只允许在 Actions 页面手动点按钮触发

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 关键：拉取完整历史，否则扫不到旧提交里的密钥

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
